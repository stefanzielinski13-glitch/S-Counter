<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zähler</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zähler">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#000;--card:#1c1c1e;--fld:#2c2c2e;--line:#3a3a3c;--blue:#0a84ff;--orange:#ff9f0a;--green:#30d158;--yellow:#ffd60a;--red:#ff453a;--mute:#8e8e93;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:#fff;font:400 17px/1.35 -apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:12px 16px 48px}
button,input,select{font:inherit;color:inherit}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px}
.nb{width:48px;height:48px;border:0;border-radius:50%;background:var(--fld);color:var(--blue);font-size:30px;line-height:1;cursor:pointer;padding:0 0 4px;flex:none}
.nb:active{opacity:.6}.nb:disabled{opacity:.3}
.nb.sm{width:38px;height:38px;font-size:24px;padding:0 0 3px}
.mt{position:relative;flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:24px;font-weight:700;letter-spacing:-.01em}
.mt i{width:8px;height:8px;border-right:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:rotate(45deg) translate(-2px,-2px)}
.mt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer;-webkit-appearance:none;appearance:none}
.hint{margin:0 0 14px;text-align:center;color:var(--mute);font-size:14px}
.hint a{color:var(--blue);text-decoration:none;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{display:grid;gap:12px}
.big{margin:0}
.cap{margin:0;color:var(--mute);font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.cap .d{opacity:1}
.val{margin:2px 0 0;font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sub{margin:4px 0 0;color:var(--mute);font-size:14px}
.sub.err,.err{color:var(--red)}
.cnt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
.pm{display:flex;gap:10px}
.pm .btn{min-width:56px;font-size:24px;padding:0 16px}
.pm .btn.add{min-width:84px}
.a{color:var(--blue)}.b{color:var(--orange)}
.btn.add.a{background:var(--blue);color:#fff}.btn.add.b{background:var(--orange);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0;padding:14px 8px}
.stats>div{text-align:center;padding:0 4px;min-width:0}
.stats>div+div{border-left:1px solid var(--line)}
.stats .cap{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats p:last-child{margin:2px 0 0;font-size:17px;font-weight:700;white-space:nowrap}
h2{margin:22px 4px 10px;font-size:20px;font-weight:700}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.h2row h2{margin:0}
.h2row .ctl{display:flex;gap:8px}
.list{padding:0;overflow:hidden}
.it{display:grid;grid-template-columns:10px 1fr auto 12px;gap:12px;align-items:center;width:100%;min-height:62px;padding:8px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.it:first-child{border-top:0}.it:active{background:var(--fld)}
.d{width:10px;height:10px;border-radius:50%;background:var(--mute);opacity:.5;flex:none}
.d.a{background:var(--blue);opacity:1}.d.b{background:var(--orange);opacity:1}
.d.ab{background:linear-gradient(90deg,var(--blue) 50%,var(--orange) 50%);opacity:1}
.tx{min-width:0}.tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{display:block;font-size:14px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am{font-weight:600}.ch{color:var(--mute);font-size:22px}
.empty{margin:0;padding:18px 16px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:12px;color:var(--mute);font-weight:500;padding:2px 0 4px}
.day{aspect-ratio:1/1.2;min-width:0;width:100%;border:1px solid transparent;border-radius:10px;background:var(--fld);padding:5px 0 0;display:flex;flex-direction:column;align-items:center;font-size:15px;font-weight:600;cursor:pointer}
.day:active{opacity:.6}
.day.x{background:none;cursor:default}
.day:disabled{opacity:.3;cursor:default}
.day.today{border-color:var(--mute)}
.day.sel{border-color:var(--blue);background:rgba(10,132,255,.18)}
.day small{display:block;font-size:11px;font-weight:700;line-height:1.15}
.form{display:grid;gap:10px}
.form label{display:grid;gap:6px;color:var(--mute);font-size:14px;font-weight:500}
.f{width:100%;min-height:50px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--fld);color:#fff;font-size:17px;outline:0}
.f:focus{border-color:var(--blue)}
.btn{min-height:50px;border:0;border-radius:14px;padding:0 18px;background:var(--fld);color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.btn:active{opacity:.7}.btn:disabled{opacity:.35}.btn.del{color:var(--red)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#st{text-align:center;min-height:20px}
#warn{margin:0 0 12px;padding:12px 14px;border:1px solid var(--red);border-radius:12px;color:var(--red);font-size:15px}
@media(min-width:700px){.hero{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="app">
<p id="warn" role="alert" hidden></p>
<header class="nav">
<button class="nb" id="prev" type="button" aria-label="Vorheriger Tag">‹</button>
<label class="mt"><span id="mt"></span><i></i><input type="date" id="dp" aria-label="Tag wählen"></label>
<button class="nb" id="next" type="button" aria-label="Nächster Tag">›</button>
</header>
<p class="hint" id="note"></p>

<div class="hero">
<section class="card big cnt">
  <div><p class="cap"><i class="d a"></i><span class="nA"></span></p><p class="val" id="vA">0</p></div>
  <div class="pm"><button class="btn" type="button" data-k="a" data-d="-1" aria-label="eins weniger">−</button><button class="btn add a" type="button" data-k="a" data-d="1">+1</button></div>
</section>
<section class="card big cnt">
  <div><p class="cap"><i class="d b"></i><span class="nB"></span></p><p class="val" id="vB">0</p></div>
  <div class="pm"><button class="btn" type="button" data-k="b" data-d="-1" aria-label="eins weniger">−</button><button class="btn add b" type="button" data-k="b" data-d="1">+1</button></div>
</section>
</div>
<p class="sub" id="dtype" style="margin:-4px 4px 0"></p>

<div class="h2row"><h2 id="yh"></h2><div class="ctl"><button class="nb sm" id="yp" type="button" aria-label="Vorheriges Jahr">‹</button><button class="nb sm" id="yn" type="button" aria-label="Nächstes Jahr">›</button></div></div>
<section class="card stats"><div><p class="cap">Tage <span class="nA"></span></p><p class="a" id="dA">0</p></div><div><p class="cap">Tage <span class="nB"></span></p><p class="b" id="dB">0</p></div><div><p class="cap">Tage beides</p><p id="dAB">0</p></div></section>
<section class="card stats"><div><p class="cap">Σ <span class="nA"></span></p><p class="a" id="sA">0</p></div><div><p class="cap">Σ <span class="nB"></span></p><p class="b" id="sB">0</p></div><div><p class="cap">Ohne Eintrag</p><p id="d0">0</p></div></section>
<p class="sub" id="ysub" style="margin:-4px 4px 0"></p>

<div class="h2row"><h2 id="ch"></h2><div class="ctl"><button class="nb sm" id="cp" type="button" aria-label="Vorheriger Monat">‹</button><button class="nb sm" id="cn" type="button" aria-label="Nächster Monat">›</button></div></div>
<section class="card"><div class="grid" id="cal"></div></section>
<p class="sub" style="margin:-4px 4px 0">Tag antippen, um ihn oben zu öffnen und nachzutragen.</p>

<h2>Monate</h2>
<section class="card list" id="list"></section>

<h2>Namen</h2>
<section class="card form">
<label><span><i class="d a" style="display:inline-block;margin-right:6px"></i>Kategorie A</span><input class="f" id="inA" maxlength="24" placeholder="z. B. Kaffee" autocomplete="off" enterkeyhint="done"></label>
<label><span><i class="d b" style="display:inline-block;margin-right:6px"></i>Kategorie B</span><input class="f" id="inB" maxlength="24" placeholder="z. B. Sport" autocomplete="off" enterkeyhint="done"></label>
</section>

<h2>Daten</h2>
<section class="card io"><button class="btn" id="exp" type="button">Exportieren</button><button class="btn" id="imp" type="button">Importieren</button><button class="btn" id="csv" type="button">CSV für Excel</button><button class="btn del" id="clr" type="button">Alles löschen</button><input type="file" id="file" accept=".json,application/json" hidden></section>
<p class="sub" id="st" role="status"></p>
</main>
<script>
(()=>{
const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K='zl1:data',RE=/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/;
// Datum immer lokal rechnen (nie UTC), damit kein Tag verrutscht
const p2=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const dt=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const todayK=()=>key(new Date());
const shift=(k,n)=>{const d=dt(k);d.setDate(d.getDate()+n);return key(d)};
let S={names:{a:'A',b:'B'},days:{}},canStore=true,sel=todayK(),calM=sel.slice(0,7),yr=+sel.slice(0,4),lastToday=todayK();
const stat=(t,err)=>{const e=$('#st');e.textContent=t;e.className='sub'+(err?' err':'')};
const warn=t=>{$('#warn').textContent=t;$('#warn').hidden=!t};

function clean(o){
  const s={names:{a:'A',b:'B'},days:{}};let bad=0;
  if(o&&o.names){for(const c of['a','b']){const v=o.names[c];if(typeof v==='string'&&v.trim())s.names[c]=v.trim().slice(0,24)}}
  if(o&&o.days&&typeof o.days==='object'&&!Array.isArray(o.days)){
    for(const[k,v]of Object.entries(o.days)){
      const a=Number(v&&v.a),b=Number(v&&v.b);
      if(!RE.test(k)||!(Number.isInteger(a)&&a>=0)||!(Number.isInteger(b)&&b>=0)){bad++;continue}
      if(a||b)s.days[k]={a,b};
    }
  }
  return{s,bad};
}
function storeError(e){
  if(e&&(e.name==='QuotaExceededError'||e.code===22||e.code===1014))return'Speicher voll. Bitte Daten exportieren.';
  if(e&&e.name==='SecurityError')return'Der Browser blockiert das Speichern (z. B. privater Modus). Bitte Daten exportieren.';
  return'Speichern fehlgeschlagen ('+(e&&e.message||'unbekannter Fehler')+'). Bitte Daten exportieren.';
}
function load(){
  try{
    localStorage.setItem('zl1:test','1');localStorage.removeItem('zl1:test');
    const raw=localStorage.getItem(K);
    if(raw){
      try{const r=clean(JSON.parse(raw));S=r.s;if(r.bad)warn(r.bad+' beschädigte(r) Eintrag/Einträge übersprungen. Bitte eine Sicherung importieren.')}
      catch(e){warn('Gespeicherte Daten sind beschädigt. Bitte eine Sicherung importieren.')}
    }
  }catch(e){canStore=false;warn('Der Speicher dieses Browsers ist nicht verfügbar (z. B. privater Modus). Eingaben gehen beim Schließen verloren. Bitte regelmäßig exportieren.')}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
// Schreibt und liest zur Kontrolle zurück
function write(msg){
  if(!canStore){stat('Nicht gespeichert: Speicher nicht verfügbar.',1);return false}
  try{
    const s=JSON.stringify(S);localStorage.setItem(K,s);
    if(localStorage.getItem(K)!==s)throw new Error('Kontrolllesen fehlgeschlagen');
    stat(msg||'Gespeichert.');return true;
  }catch(e){stat(storeError(e),1);return false}
}
const get=k=>S.days[k]||{a:0,b:0};
const tg=n=>n+(n===1?' Tag':' Tage');
const kind=v=>v.a&&v.b?'ab':v.a?'a':v.b?'b':'';
const label=v=>{const n=S.names;return v.a&&v.b?n.a+' und '+n.b:v.a?n.a:v.b?n.b:''};

function head(){
  const t=todayK(),d=dt(sel);
  $('#mt').textContent=WS[d.getDay()]+', '+d.getDate()+'. '+MN[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'');
  $('#dp').value=sel;$('#dp').max=t;
  $('#next').disabled=sel>=t;
  $('#note').innerHTML=sel===t?'Heute, '+WD[d.getDay()]+'.':'Nachtragen für '+WD[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'. · <a href="#" id="tod">Zu heute</a>';
  const v=get(sel);
  $('#vA').textContent=v.a;$('#vB').textContent=v.b;
  $('[data-k="a"][data-d="-1"]').disabled=!v.a;$('[data-k="b"][data-d="-1"]').disabled=!v.b;
  $('#dtype').textContent=kind(v)?'Dieser Tag zählt als Tag mit '+label(v)+'.':'An diesem Tag noch nichts gezählt.';
}
function names(){
  $$('.nA').forEach(e=>e.textContent=S.names.a);$$('.nB').forEach(e=>e.textContent=S.names.b);
  if(document.activeElement!==$('#inA'))$('#inA').value=S.names.a;
  if(document.activeElement!==$('#inB'))$('#inB').value=S.names.b;
}
function year(){
  const t=new Date(),ty=t.getFullYear();
  let dA=0,dB=0,dAB=0,sA=0,sB=0,any=0;
  for(const[k,v]of Object.entries(S.days)){
    if(+k.slice(0,4)!==yr)continue;
    sA+=v.a;sB+=v.b;any++;if(v.a)dA++;if(v.b)dB++;if(v.a&&v.b)dAB++;
  }
  const start=new Date(yr,0,1,12),end=yr===ty?dt(todayK()):new Date(yr,11,31,12);
  const total=yr>ty?0:Math.round((end-start)/864e5)+1;
  $('#yh').textContent=(yr===ty?'Laufendes Jahr ':'Jahr ')+yr;
  $('#yn').disabled=yr>=ty;
  $('#dA').textContent=dA;$('#dB').textContent=dB;$('#dAB').textContent=dAB;
  $('#sA').textContent=sA;$('#sB').textContent=sB;$('#d0').textContent=Math.max(0,total-any);
  const n=S.names;
  $('#ysub').textContent='Nur '+n.a+': '+tg(dA-dAB)+' · nur '+n.b+': '+tg(dB-dAB)+' · '+(yr===ty?'bis heute ':'')+tg(total)+' im Zeitraum.';
}
function cal(){
  const[y,m]=calM.split('-').map(Number),t=todayK(),tm=t.slice(0,7);
  $('#ch').textContent=MN[m-1]+' '+y;
  $('#cn').disabled=calM>=tm;
  let h=['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>'<div class="wd">'+w+'</div>').join('');
  const off=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate();
  for(let i=0;i<off;i++)h+='<div class="day x"></div>';
  for(let d=1;d<=dim;d++){
    const k=y+'-'+p2(m)+'-'+p2(d),v=get(k);
    h+='<button type="button" class="day'+(k===t?' today':'')+(k===sel?' sel':'')+'" data-day="'+k+'"'+(k>t?' disabled':'')+'>'+d
      +(v.a?'<small class="a">'+v.a+'</small>':'')+(v.b?'<small class="b">'+v.b+'</small>':'')+'</button>';
  }
  $('#cal').innerHTML=h;
}
function months(){
  const t=new Date(),ty=t.getFullYear(),last=yr===ty?t.getMonth():yr<ty?11:-1,n=S.names;let h='';
  for(let m=last;m>=0;m--){
    const pre=yr+'-'+p2(m+1)+'-';let dA=0,dB=0,sA=0,sB=0;
    for(const[k,v]of Object.entries(S.days)){if(!k.startsWith(pre))continue;sA+=v.a;sB+=v.b;if(v.a)dA++;if(v.b)dB++}
    const kd=dA&&dB?'ab':dA?'a':dB?'b':'';
    h+='<button type="button" class="it" data-m="'+yr+'-'+p2(m+1)+'"><i class="d '+kd+'"></i><span class="tx"><b>'+MN[m]+'</b><small>'
      +(kd?esc(n.a)+': '+tg(dA)+' ('+sA+'×) · '+esc(n.b)+': '+tg(dB)+' ('+sB+'×)':'Keine Einträge')+'</small></span><span class="am"></span><span class="ch">›</span></button>';
  }
  $('#list').innerHTML=h||'<p class="empty">Für dieses Jahr gibt es noch keine Monate.</p>';
}
function render(){names();head();year();cal();months()}

function go(k){
  const t=todayK();if(!k||!RE.test(k))return;if(k>t)k=t;
  sel=k;calM=k.slice(0,7);yr=+k.slice(0,4);render();
}
$$('.pm .btn').forEach(b=>b.addEventListener('click',()=>{
  const c=b.dataset.k,d=+b.dataset.d,v={...get(sel)};
  v[c]=Math.max(0,v[c]+d);
  if(v.a||v.b)S.days[sel]=v;else delete S.days[sel];
  write();render();
}));
$('#prev').onclick=()=>go(shift(sel,-1));
$('#next').onclick=()=>go(shift(sel,1));
$('#dp').onchange=e=>{if(e.target.value)go(e.target.value)};
$('#note').addEventListener('click',e=>{if(e.target.id==='tod'){e.preventDefault();go(todayK())}});
$('#yp').onclick=()=>{yr--;year();months()};
$('#yn').onclick=()=>{if(yr<new Date().getFullYear()){yr++;year();months()}};
const mv=n=>{const[y,m]=calM.split('-').map(Number),d=new Date(y,m-1+n,1);calM=d.getFullYear()+'-'+p2(d.getMonth()+1);cal()};
$('#cp').onclick=()=>mv(-1);
$('#cn').onclick=()=>{if(calM<todayK().slice(0,7))mv(1)};
$('#cal').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(b&&!b.disabled){go(b.dataset.day);scrollTo({top:0,behavior:'smooth'})}});
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){calM=b.dataset.m;cal();$('#ch').scrollIntoView({behavior:'smooth',block:'start'})}});
function setName(c,el){
  const v=el.value.trim().slice(0,24)||c.toUpperCase();
  if(S.names[c]===v){el.value=v;return}
  S.names[c]=v;el.value=v;write('Name gespeichert.');render();
}
['a','b'].forEach(c=>{const el=$('#in'+c.toUpperCase());el.addEventListener('change',()=>setName(c,el));el.addEventListener('keydown',e=>{if(e.key==='Enter')el.blur()})});

async function share(text,name,type,title){
  const f=window.File&&new File([text],name,{type});
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title});return true}catch(e){if(e&&e.name==='AbortError')return false}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true;
}
$('#exp').onclick=async()=>{
  try{
    const json=JSON.stringify({app:'zaehler',version:1,exportedAt:new Date().toISOString(),names:S.names,days:S.days},null,2);
    if(await share(json,'zaehler-'+todayK()+'.json','application/json','Zähler-Sicherung'))stat('Sicherung exportiert: '+Object.keys(S.days).length+' Tag(e).');
  }catch(e){stat('Export fehlgeschlagen: '+e.message,1)}
};
$('#csv').onclick=async()=>{
  try{
    const q=s=>'"'+String(s).replace(/"/g,'""')+'"',n=S.names;
    const rows=[['Datum',n.a,n.b,'Art'].map(q).join(';')];
    Object.keys(S.days).sort().forEach(k=>{const v=S.days[k],d=dt(k);rows.push([p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear(),v.a,v.b,q(label(v))].join(';'))});
    if(await share('﻿'+rows.join('\r\n'),'zaehler-'+todayK()+'.csv','text/csv','Zähler-Tabelle'))stat('CSV exportiert.');
  }catch(e){stat('Export fehlgeschlagen: '+e.message,1)}
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||typeof d.days!=='object'||Array.isArray(d.days))throw new Error('Keine Zählerdaten in der Datei gefunden.');
    const r=clean(d),n=Object.keys(r.s.days).length;
    if(!confirm(n+' Tag(e) importieren? Die aktuellen Daten werden ersetzt.'))return;
    S=r.s;if(write(n+' Tag(e) importiert'+(r.bad?', '+r.bad+' ungültige übersprungen':'')+'.'))render();
  }catch(err){stat('Import fehlgeschlagen: '+(err instanceof SyntaxError?'Die Datei ist kein gültiges JSON.':err.message),1)}
};
$('#clr').onclick=()=>{
  if(!confirm('Alle Zählungen löschen? Die Namen bleiben erhalten.'))return;
  if(!confirm('Wirklich? Das kann nicht rückgängig gemacht werden. Vorher besser exportieren.'))return;
  S.days={};write('Alle Zählungen gelöscht.');render();
};
// Wenn die App über Mitternacht offen war: von gestern auf heute springen
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  const t=todayK();if(t!==lastToday){if(sel===lastToday)go(t);lastToday=t}
  render();
});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
load();render();
})();
</script>
</body>
</html>
